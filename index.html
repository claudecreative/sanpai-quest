<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}html,body{height:100%}</style>
</head>
<body>
<title>参拝クエスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Dela+Gothic+One&display=swap">
<style>
/* Layout: one phone-shaped stage (192x416 logical px), Phaser canvas below, HTML overlay for HUD, controls and text */
:root{
  --night:#07041a; --ink:#1a0f2e; --paper:#fff6e8; --mute:#cfc6e6;
  --gold:#ffd23f; --shu:#e03a2e; --ai:#2f6fe0; --plum:#3a2458;
  --pixel:'DotGothic16','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --display:'Dela Gothic One','DotGothic16',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--paper);font-family:var(--pixel);overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  display:grid;place-items:center}
#stage{position:relative;height:min(100%, calc(100vw * 416 / 192));aspect-ratio:192/416;max-width:100vw;container-type:size;overflow:hidden;background:var(--night)}
#game,#game canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
#ui{position:absolute;inset:0;pointer-events:none;--u:calc(100cqw / 192);font-size:calc(var(--u) * 7)}
#touch{position:absolute;inset:0;pointer-events:auto}
.outline{text-shadow:calc(var(--u)*1) 0 0 var(--ink),calc(var(--u)*-1) 0 0 var(--ink),0 calc(var(--u)*1) 0 var(--ink),0 calc(var(--u)*-1) 0 var(--ink),calc(var(--u)*1) calc(var(--u)*1) 0 var(--ink),calc(var(--u)*-1) calc(var(--u)*-1) 0 var(--ink)}

#hud{position:absolute;left:0;right:0;top:0;padding:calc(var(--u)*5) calc(var(--u)*6);background:rgba(26,15,46,.86);border-bottom:calc(var(--u)*1.5) solid var(--gold);display:flex;flex-direction:column;gap:calc(var(--u)*4)}
.row{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*4)}
#hearts{display:flex;gap:calc(var(--u)*2)}
#hearts img{width:calc(var(--u)*12);height:calc(var(--u)*10.5);image-rendering:pixelated}
#lv{color:var(--gold);font-size:calc(var(--u)*7.5)}
#coins{display:flex;align-items:center;gap:calc(var(--u)*2);font-variant-numeric:tabular-nums;font-size:calc(var(--u)*7.5)}
#coins img{width:calc(var(--u)*9);height:calc(var(--u)*9);image-rendering:pixelated}
#mute{pointer-events:auto;font-family:var(--pixel);font-size:calc(var(--u)*5.5);color:var(--paper);background:var(--plum);border:calc(var(--u)*.8) solid var(--mute);padding:calc(var(--u)*1) calc(var(--u)*3);cursor:pointer}
.prog{display:flex;align-items:center;gap:calc(var(--u)*4);font-size:calc(var(--u)*5.5)}
.bar{flex:1;height:calc(var(--u)*5);background:var(--plum);border:calc(var(--u)*1) solid var(--paper);position:relative}
#progFill{height:100%;width:0;background:var(--shu)}
.tick{position:absolute;top:calc(var(--u)*-1);bottom:calc(var(--u)*-1);width:calc(var(--u)*1);background:var(--paper)}

#banner{position:absolute;left:50%;top:calc(var(--u)*118);transform:translateX(-50%);white-space:nowrap;padding:calc(var(--u)*2) calc(var(--u)*6);background:var(--shu);border:calc(var(--u)*1) solid var(--ink);box-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 var(--ink);font-size:calc(var(--u)*7.5);letter-spacing:.1em;animation:pop .35s steps(4) both}
@keyframes pop{from{transform:translateX(-50%) scale(.4);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
#msg{position:absolute;left:calc(var(--u)*6);right:calc(var(--u)*6);top:calc(var(--u)*40);padding:calc(var(--u)*5) calc(var(--u)*6);background:var(--ink);border:calc(var(--u)*1.5) solid var(--paper);box-shadow:inset 0 0 0 calc(var(--u)*1) var(--ink),inset 0 0 0 calc(var(--u)*2) var(--gold);display:flex;gap:calc(var(--u)*5);align-items:center;line-height:1.55;font-size:calc(var(--u)*7)}
#msg img{width:calc(var(--u)*20);height:calc(var(--u)*20);image-rendering:pixelated;flex:none}
#bossbar{position:absolute;left:calc(var(--u)*8);right:calc(var(--u)*8);top:calc(var(--u)*36);display:flex;align-items:center;gap:calc(var(--u)*4);font-size:calc(var(--u)*6.5);color:#ff7fa8}
.bbar{flex:1;height:calc(var(--u)*6);background:var(--ink);border:calc(var(--u)*1) solid var(--paper)}
#bossFill{height:100%;width:100%;background:linear-gradient(90deg,#9a5cd6,#ff7fa8)}
#msg b{display:block;font-weight:400;color:var(--gold);font-size:calc(var(--u)*5.5)}

#controls{position:absolute;inset:0;pointer-events:none}
#stick{position:absolute;left:calc(var(--u)*12);bottom:calc(var(--u)*20);width:calc(var(--u)*58);height:calc(var(--u)*58);border-radius:50%;border:calc(var(--u)*1.5) solid rgba(255,246,232,.55);background:rgba(26,15,46,.35);opacity:.7;transition:opacity .15s}
#stick.active{opacity:1;border-color:rgba(255,246,232,.9);background:rgba(26,15,46,.5)}
#knob{position:absolute;left:50%;top:50%;width:calc(var(--u)*24);height:calc(var(--u)*24);margin:calc(var(--u)*-12) 0 0 calc(var(--u)*-12);border-radius:50%;background:rgba(255,246,232,.85);border:calc(var(--u)*1.5) solid var(--ink)}
#stickLabel{position:absolute;left:0;right:0;top:calc(100% + var(--u)*2);text-align:center;font-size:calc(var(--u)*5);color:rgba(255,246,232,.75);line-height:1.3}
#stick.active #stickLabel,#stick.used #stickLabel{display:none}
.btn{pointer-events:auto;position:absolute;border-radius:50%;border:calc(var(--u)*1.5) solid var(--ink);font-family:var(--display);display:grid;place-items:center;cursor:pointer;touch-action:none;padding:0}
#btnHarai{right:calc(var(--u)*10);bottom:calc(var(--u)*34);width:calc(var(--u)*44);height:calc(var(--u)*44);background:var(--shu);color:var(--gold);font-size:calc(var(--u)*18);box-shadow:inset 0 calc(var(--u)*-3) 0 #9c1f1a,0 calc(var(--u)*2.5) 0 var(--ink),0 0 0 calc(var(--u)*2) var(--gold)}
#btnHashiru{right:calc(var(--u)*60);bottom:calc(var(--u)*16);width:calc(var(--u)*32);height:calc(var(--u)*32);background:var(--ai);color:var(--paper);font-size:calc(var(--u)*12);box-shadow:inset 0 calc(var(--u)*-2.5) 0 #22307a,0 calc(var(--u)*2) 0 var(--ink)}
.btn.down{transform:translateY(calc(var(--u)*1.5));filter:brightness(1.25)}
.btn:focus-visible,#mute:focus-visible,.cta:focus-visible{outline:calc(var(--u)*1.5) solid var(--gold);outline-offset:calc(var(--u)*1)}

#title{position:absolute;inset:0;pointer-events:auto;display:flex;flex-direction:column;align-items:center;cursor:pointer;background:transparent;border:0;color:inherit;font-family:inherit;padding:0}
.t-eyebrow{margin-top:calc(var(--u)*26);font-size:calc(var(--u)*5.5);letter-spacing:.3em;color:var(--gold)}
.t-logo{margin-top:calc(var(--u)*3);font-family:var(--display);font-size:calc(var(--u)*30);line-height:1.05;color:var(--gold);text-align:center;
  text-shadow:calc(var(--u)*1.5) 0 0 var(--ink),calc(var(--u)*-1.5) 0 0 var(--ink),0 calc(var(--u)*1.5) 0 var(--ink),0 calc(var(--u)*-1.5) 0 var(--ink),calc(var(--u)*1.5) calc(var(--u)*1.5) 0 var(--ink),calc(var(--u)*-1.5) calc(var(--u)*-1.5) 0 var(--ink),0 calc(var(--u)*3.5) 0 var(--shu),0 calc(var(--u)*5) 0 var(--ink)}
.t-sub{margin-top:calc(var(--u)*7);padding:calc(var(--u)*3) calc(var(--u)*7);background:var(--ink);border:calc(var(--u)*1) solid var(--gold);font-size:calc(var(--u)*7)}
.t-start{position:absolute;bottom:calc(var(--u)*134);padding:calc(var(--u)*2) calc(var(--u)*6);background:rgba(26,15,46,.7);font-size:calc(var(--u)*9);letter-spacing:.15em;animation:blink 1s steps(2) infinite}
.t-note{position:absolute;bottom:calc(var(--u)*6);font-size:calc(var(--u)*5);color:var(--mute)}
@keyframes blink{50%{opacity:.15}}

#steps{position:absolute;left:calc(var(--u)*6);right:calc(var(--u)*6);top:calc(var(--u)*7);display:flex;gap:calc(var(--u)*3)}
#steps div{flex:1;padding:calc(var(--u)*3) 0;text-align:center;font-size:calc(var(--u)*5.5);background:rgba(26,15,46,.8);border:calc(var(--u)*1) solid #8a809e;color:var(--mute)}
#steps div.on{background:var(--shu);border-color:var(--gold);color:var(--paper);box-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 var(--ink)}
#steps div.done{color:var(--gold)}

.fx{position:absolute;transform:translate(-50%,-50%);font-family:var(--display);font-size:calc(var(--u)*9);color:var(--gold);white-space:nowrap;animation:fx 1s ease-out forwards;pointer-events:none}
@keyframes fx{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%)}}

#result{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.r-head{margin-top:calc(var(--u)*20);padding:calc(var(--u)*4) calc(var(--u)*9);background:var(--ink);border:calc(var(--u)*1.5) solid var(--gold);font-size:calc(var(--u)*9);letter-spacing:.06em;min-height:1.6em}
#slip{margin-top:calc(var(--u)*10);width:calc(var(--u)*72);height:calc(var(--u)*178);box-sizing:border-box;background:var(--paper);color:var(--ink);border:calc(var(--u)*2) solid var(--ink);box-shadow:calc(var(--u)*3) calc(var(--u)*3) 0 #9c1f1a;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*4);padding:calc(var(--u)*5);animation:slip .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes slip{from{transform:scale(.2) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.s-top{width:100%;padding:calc(var(--u)*2) 0;background:var(--shu);color:var(--paper);text-align:center;letter-spacing:.4em;font-size:calc(var(--u)*7)}
.s-no{font-size:calc(var(--u)*5.5);color:#9c1f1a;letter-spacing:.2em}
.s-big{display:flex;flex-direction:column;align-items:center;font-family:var(--display);font-size:calc(var(--u)*44);line-height:1;color:var(--shu);text-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 var(--ink)}
.s-foot{margin-top:auto;width:100%;border-top:calc(var(--u)*1) dashed var(--shu);padding-top:calc(var(--u)*3);text-align:center;font-size:calc(var(--u)*5);color:#5a4f75}
#best{margin-top:calc(var(--u)*8);font-family:var(--display);font-size:calc(var(--u)*12);color:var(--gold);text-align:center;animation:pop2 .5s steps(5) both;
  text-shadow:calc(var(--u)*1.5) 0 0 var(--ink),calc(var(--u)*-1.5) 0 0 var(--ink),0 calc(var(--u)*1.5) 0 var(--ink),0 calc(var(--u)*-1.5) 0 var(--ink),calc(var(--u)*1.5) calc(var(--u)*1.5) 0 var(--ink),0 calc(var(--u)*3) 0 #9c1f1a}
@keyframes pop2{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
#tally{margin-top:calc(var(--u)*4);font-size:calc(var(--u)*6.5);padding:calc(var(--u)*2) calc(var(--u)*6);background:rgba(26,15,46,.75)}
.r-btns{position:absolute;left:calc(var(--u)*10);right:calc(var(--u)*10);bottom:calc(var(--u)*12);display:flex;gap:calc(var(--u)*6);pointer-events:auto}
.cta{flex:1;height:calc(var(--u)*24);font-family:var(--pixel);font-size:calc(var(--u)*7.5);border:calc(var(--u)*1.5) solid var(--ink);box-shadow:0 calc(var(--u)*2.5) 0 var(--ink);cursor:pointer}
.cta.red{background:var(--shu);color:var(--paper)}
.cta.white{background:var(--paper);color:var(--ink)}
#slip.dd{background:linear-gradient(180deg,#fff7c2,#ffd23f 60%,#f0a020);box-shadow:calc(var(--u)*3) calc(var(--u)*3) 0 #9c1f1a,0 0 calc(var(--u)*24) rgba(255,230,120,.9)}
#slip.dd .s-big{font-size:calc(var(--u)*34)}
#slip.dd .s-foot{color:#6a3a10}
#best.dd{font-size:calc(var(--u)*10)}
.r-hint{margin-top:calc(var(--u)*3);font-size:calc(var(--u)*5.5);color:var(--paper);background:rgba(26,15,46,.75);padding:calc(var(--u)*1.5) calc(var(--u)*5)}
#endcard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;pointer-events:none;animation:fadeIn 2s both}
#endcard .r-btns{pointer-events:auto}
.e-year{margin-top:calc(var(--u)*40);font-size:calc(var(--u)*7);letter-spacing:.4em;color:var(--gold)}
.e-big{margin-top:calc(var(--u)*6);font-family:var(--display);font-size:calc(var(--u)*15);line-height:1.35;text-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 var(--ink)}
.e-msg{margin-top:calc(var(--u)*8);font-size:calc(var(--u)*7.5);line-height:1.8;text-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 var(--ink);animation:fadeIn 2s 1.5s both}
.e-foot{position:absolute;bottom:calc(var(--u)*46);font-family:var(--display);font-size:calc(var(--u)*8);color:var(--gold);text-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 var(--ink);animation:fadeIn 2s 3s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#gate{position:absolute;inset:0;pointer-events:auto;cursor:pointer;border:0;padding:0;background:rgba(7,4,26,.78);color:var(--paper);font-family:var(--pixel);display:grid;place-items:center}
.g-box{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*5);padding:calc(var(--u)*12) calc(var(--u)*14);background:var(--ink);border:calc(var(--u)*1.5) solid var(--paper);box-shadow:inset 0 0 0 calc(var(--u)*1) var(--ink),inset 0 0 0 calc(var(--u)*2) var(--gold)}
.g-eyebrow{font-size:calc(var(--u)*5.5);letter-spacing:.2em;color:var(--gold)}
.g-name{font-family:var(--display);font-size:calc(var(--u)*16);color:var(--gold)}
.g-note{font-size:calc(var(--u)*6.5);color:var(--mute)}
.g-tap{margin-top:calc(var(--u)*4);font-size:calc(var(--u)*8);animation:blink 1s steps(2) infinite}
#title:not([hidden]) .t-logo{animation:logoIn .7s steps(7) both}
#title:not([hidden]) .t-sub{animation:logoIn .5s .5s steps(5) both}
@keyframes logoIn{from{transform:translateY(calc(var(--u)*-40)) scale(1.4);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.t-start,.g-tap{animation:none}#title .t-logo,#title .t-sub{animation:none!important}}
</style>

<div id="stage">
  <div id="game"></div>
  <div id="ui">
    <div id="touch" hidden></div>
    <div id="hud" hidden>
      <div class="row">
        <div id="hearts"></div>
        <div id="lv">運 Lv.1</div>
        <div id="coins"><img id="coinIcon" alt="小判"><span id="coinNum">×00</span></div>
        <button id="mute" type="button" aria-pressed="false">音 ON</button>
      </div>
      <div class="prog"><span style="color:var(--mute)">入口</span><div class="bar"><div id="progFill"></div><div class="tick" style="left:33%"></div><div class="tick" style="left:66%"></div></div><span style="color:var(--gold)">神社</span></div>
    </div>
    <div id="banner" class="outline" hidden></div>
    <div id="controls" hidden>
      <div id="stick"><div id="knob"></div><span id="stickLabel">ドラッグで<br>移動</span></div>
      <button id="btnHashiru" class="btn" type="button" aria-label="跳ぶ（ジャンプ）">跳</button>
      <button id="btnHarai" class="btn" type="button" aria-label="祓う（お札を投げる）">払</button>
    </div>
    <div id="msg" hidden><img id="msgIcon" alt=""><div><b id="msgName">ひつじ</b><span id="msgText"></span></div></div>
    <div id="bossbar" hidden><span>怠け心</span><div class="bbar"><div id="bossFill"></div></div></div>
    <div id="steps" hidden><div id="st1">① お賽銭</div><div id="st2">② 鈴を鳴らす</div><div id="st3">③ 二礼二拍手一礼</div></div>
    <div id="result" hidden>
      <div class="r-head" id="rHead"></div>
      <div id="slip" hidden><div class="s-top">御神籤</div><div class="s-no">第一番</div><div class="s-big" id="sBig"><span>大</span><span>吉</span></div><div class="s-foot">タカヨシ神社</div></div>
      <div id="best" hidden>最高の年になるでしょう！</div>
      <div id="tally" hidden></div>
      <div class="r-hint" id="hint" hidden></div>
      <div class="r-btns" id="rBtns" hidden>
        <button class="cta red" id="again" type="button">帰り道へ ▶</button>
        <button class="cta white" id="toTitle" type="button">もう一度あそぶ</button>
      </div>
    </div>
    <div id="endcard" hidden>
      <div class="e-year outline">2027</div>
      <div class="e-big">あけまして<br>おめでとう<br>ございます</div>
      <div class="e-msg">あなたの一年を、<br>心から応援しています。</div>
      <div class="e-foot">参拝クエスト ─ おしまい</div>
      <div class="r-btns" id="eBtns" hidden>
        <button class="cta red" id="endAgain" type="button">もう一度あそぶ</button>
        <button class="cta white" id="endTitle" type="button">タイトルへ</button>
      </div>
    </div>
    <button id="gate" type="button" hidden aria-label="タップしてはじめる">
      <div class="g-box">
        <div class="g-eyebrow">カレンダーハガキ 1月号</div>
        <div class="g-name">参拝クエスト</div>
        <div class="g-note">♪ 音が出ます</div>
        <div class="g-tap">▶ タップしてはじめる</div>
      </div>
    </button>
    <button id="title" type="button" hidden aria-label="タップでスタート">
      <div class="t-eyebrow outline">2027 新春 ／ カレンダーハガキ 1月号</div>
      <div class="t-logo">参拝<br>クエスト</div>
      <div class="t-sub">タカヨシ神社を目指せ！</div>
      <div class="t-start outline">▶ タップでスタート</div>
      <div class="t-note">♪ 音が出ます　／　PCは矢印キー・Z（払）・X（跳）</div>
    </button>
  </div>

// ---------- sequencer ----------
function play(i) {
  ensure(); stop(true);
  const tr = TRACKS[i], step = 60 / tr.bpm / tr.spb, out = ctx.createGain(); out.connect(master);
  cur = { i, tr, step, out, start: ctx.currentTime + .08, next: 0 };
  cur.timer = setInterval(tick, 25); tick(); render();
}
function tick() {
  if (!cur) return;
  const { tr, step, start, out } = cur, horizon = ctx.currentTime + .18;
  while (start + cur.next * step < horizon) {
    const s = cur.next;
    if (!tr.loop && s >= tr.len) { clearInterval(cur.timer); const c = cur; setTimeout(() => { if (cur === c) stop(); }, 1800); break; }
    const t = start + s * step;
    tr.ch.forEach(c => {
      const evs = c.byStep[s % c.len]; if (!evs) return;
      evs.forEach(e => {
        if (c.inst === 'drum') drum(e.tok, t, out, c.vol); else voice(c, e.tok, t, e.len * step, out);
        hitQ[c.m].push(t);
      });
    });
    cur.next++;
  }
}
function stop(silent) {
  if (cur) {
    clearInterval(cur.timer);
    const o = cur.out; o.gain.setTargetAtTime(0, ctx.currentTime, .03); setTimeout(() => o.disconnect(), 400);
    cur = null; hitQ.forEach(q => q.length = 0);
  }
  if (!silent) render();
}

    placeTorii(this, D.toriiEnd);
    this.hs = this.add.image(86, 70, 'shadow').setScale(1.4);
    this.hero = this.add.image(86, 70, 'player_front').setOrigin(.5, 1).setScale(2);
    this.ss = this.add.image(118, 76, 'shadow').setScale(1.2);
    this.sheep = this.add.image(118, 76, 'sheep').setOrigin(.5, 1).setScale(2);
    this.hy = 70; this.hx = 86; this.sx = 118; this.sy = 76; this.walkT = 0; this.phase = 'walk'; this.queue = []; this.qT = 0;
    cam.scrollY = 0;
    this.talks = [
      { y: 150, t: 'おつかれさま。帰りは、ゆっくり歩こうメェ。', ms: 3400 },
      { y: 330, t: '2027年は、どんな年になるかな。', ms: 3000 },
      { y: 470, t: '大吉は、ただのきっかけ。', ms: 2800 },
      { y: 600, t: 'どんな一年にするかは――きみ次第だメェ。', ms: 3600, spark: true },
      { y: 760, t: '怠け心も、きみの一部。うまく付き合っていこうメェ。', ms: 3600 },
    ];
    bgm('shinshun'); banner('帰り道　千本鳥居');
    this.time.delayedCall(900, () => this.queue.push({ t: '帰りは、下へ歩いていこうメェ。', ms: 2600 }));
  }
  sparkRing(x, y, n, r) {
    for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, sp = this.add.image(x + Math.cos(a) * r, y + Math.sin(a) * r * .8, 'spark').setDepth(3000);
      this.tweens.add({ targets: sp, alpha: 0, y: sp.y - 10, duration: 1200, delay: i * 40, onComplete: () => sp.destroy() }); }
  }
  update(_, dms) {
    const dt = Math.min(dms / 1000, .05), cam = this.cameras.main;
    let moving = false;
    if (this.phase === 'walk') {
      const [ix, iy] = readMove(); moving = Math.abs(ix) + Math.abs(iy) > .1;
      this.hx += ix * 56 * dt; this.hy += iy * 56 * dt;
      this.hy = Phaser.Math.Clamp(this.hy, 50, 1100);
      const [b0, b1] = this.hy < 990 ? [62, 130] : [24, 168]; this.hx = Phaser.Math.Clamp(this.hx, b0, b1);
      if (moving) { this.walkT += dt; if (this.walkT > .16) { this.walkT = 0; this.hero.setFlipX(!this.hero.flipX); } if (Math.abs(iy) > .2) this.hero.setTexture(iy < 0 ? 'player_back' : 'player_front'); }
      for (const t of this.talks) if (!t.done && this.hy > t.y) { t.done = true; this.queue.push(t); }
      if (this.hy >= 1080) { this.phase = 'farewell'; show('controls', false); show('touch', false); input.x = input.y = 0; this.hero.setFlipX(false);
        this.tweens.add({ targets: this, hx: 96, duration: 500 }); this.queue = []; this.farewell(); }
    }
    this.qT -= dt;
    if (this.phase === 'walk' && this.qT <= 0 && this.queue.length) {
      const q = this.queue.shift(); say(q.t, q.ms); this.qT = q.ms / 1000 + .3;
      if (q.spark) this.sparkRing(this.sx, this.sy - 16, 10, 18);
    }
    const stx = this.hy > 900 ? 96 : Phaser.Math.Clamp(this.hx + 30, 66, 128), sty = Math.min(this.hy + 6, 990);
    const pdx = stx - this.sx; this.sx += pdx * Math.min(1, dt * 3); this.sy += (sty - this.sy) * Math.min(1, dt * 3);
    if (this.phase === 'walk') this.sheep.setFlipX(this.qT > 0 ? this.hx < this.sx : pdx < -1);
    const bob = moving ? Math.abs(Math.sin(this.time.now / 170)) * 2 : 0, sbob = Math.abs(pdx) > 2 || Math.abs(sty - this.sy) > 2 ? Math.abs(Math.sin(this.time.now / 170)) * 2 : 0;
    this.hero.setPosition(this.hx, this.hy - bob).setDepth(this.hy); this.hs.setPosition(this.hx, this.hy).setDepth(this.hy - 1);
    if (!this.gone) { this.sheep.setPosition(this.sx, this.sy - sbob).setDepth(this.sy); this.ss.setPosition(this.sx, this.sy).setDepth(this.sy - 1); }
    const target = Phaser.Math.Clamp((this.phase === 'walk' ? this.hy : 1010) - GH * .5, 0, 1240 - GH);
    cam.scrollY += (target - cam.scrollY) * Math.min(1, dt * 3);
  }
  farewell() {
    const T = (ms, f) => this.time.delayedCall(ms, f), sc = (x, y) => [x - this.cameras.main.scrollX, y - this.cameras.main.scrollY];
    this.hero.setTexture('player_back'); bgm('wakare');
    T(300, () => say('…え？', 1700, '主人公'));
    T(2100, () => say('ぼくは、ここまで。この鳥居の先は、きみの一年だメェ。', 4200));
    T(6500, () => {
      this.halo = this.add.image(this.sx, this.sy - 14, 'glow').setTint(0xffe08a).setBlendMode('ADD').setScale(.5).setDepth(this.sy - 2);
      this.tweens.add({ targets: this.halo, scale: 3.4, duration: 1400, ease: 'Sine.out' });
      this.tweens.add({ targets: this.halo, alpha: .6, duration: 900, yoyo: true, repeat: -1 });
      this.sparkRing(this.sx, this.sy - 16, 14, 30);
      say('怠け心がまた出てきても、大丈夫。きみなら、きっと祓えるメェ。', 4400);
    });
    T(11100, () => say('一年間、ずっと応援してるよ！', 3400));
    T(14600, () => { say('ありがとう！ がんばるよ！', 2800, '主人公'); this.hero.setTexture('player_wave');
      this.waveEv = this.time.addEvent({ delay: 320, loop: true, callback: () => this.hero.setFlipX(!this.hero.flipX) }); });
    T(17600, () => { this.gone = true; this.sparkRing(this.sx, this.sy - 16, 18, 26);
      this.tweens.add({ targets: [this.sheep, this.ss], alpha: 0, duration: 1600 }); this.tweens.add({ targets: this.sheep, y: this.sy - 30, duration: 1600 });
      this.halo && this.tweens.add({ targets: this.halo, alpha: 0, scale: 5, duration: 1800 });
      T(300, () => say('またね。', 2200)); });
    T(20600, () => { this.waveEv && this.waveEv.remove(); this.hero.setFlipX(false); this.cameras.main.fadeOut(1600, 255, 246, 232);
      this.cameras.main.once('camerafadeoutcomplete', () => this.scene.start('EndCard')); });
  }
}

class EndCard extends Phaser.Scene {
  constructor() { super('EndCard'); }
  create() {
    resetUI(); this.add.image(0, 0, 'end_card').setOrigin(0);
    this.cameras.main.fadeIn(1400, 255, 246, 232);
    const h = this.add.image(96, 372, 'player_back').setOrigin(.5, 1).setScale(1.4);
    this.tweens.add({ targets: h, y: 326, scale: .8, duration: 9000, ease: 'Sine.out' });
    this.time.addEvent({ delay: 200, loop: true, callback: () => h.setFlipX(!h.flipX) });
    const g = this.add.image(38, 286, 'glow').setTint(0xffe08a).setBlendMode('ADD').setScale(1.2).setAlpha(0);
    const sp = this.add.image(38, 290, 'sheep').setOrigin(.5, 1).setAlpha(0);
    this.tweens.add({ targets: [g, sp], alpha: { from: 0, to: .9 }, duration: 2000, delay: 3500 });
    show('endcard');
    this.time.delayedCall(5200, () => show('eBtns'));
    $('endAgain').onclick = () => { bgmStop(); this.scene.start('Play'); };
    $('endTitle').onclick = () => { bgmStop(); this.scene.start('Title'); };
  }
}

window.__sq = new Phaser.Game({
  type: Phaser.AUTO, parent: 'game', width: GW, height: GH, pixelArt: true, backgroundColor: '#07041a',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [Boot, Title, Play, Goal, Result, Ending, EndCard],
});
})();
</script>
